# Keeps the free Supabase project from pausing during long breaks (free
# projects pause after ~7 days with no activity). Every 3 days this makes one
# tiny read request — it can't see any of your data (row-level security
# returns nothing without your login), it just counts as activity.
#
# Note: GitHub turns off scheduled workflows after 60 days with no pushes to
# the repo. Publishing updates counts as activity; if it ever gets turned
# off, GitHub emails you and one click on the Actions tab turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://izxuovqjaqfxttotlklj.supabase.co/rest/v1/exercises?select=id&limit=1" \
            -H "apikey: sb_publishable_wtU0OYBoHoV0ElEx3VYxcA_cgias5h0")
          echo "Supabase answered $code"
          test "$code" = "200"
